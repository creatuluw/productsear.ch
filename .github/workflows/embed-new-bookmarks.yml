# Full corpus enrichment chain, daily. Each stage is idempotent and self-limited
# (~100 rows/run), so a nightly run catches up with whatever the Raindrop sync
# (or manual ingestion) added: crawl new entries → LLM-analyze them → classify
# archetypes → embed for search.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   DATABASE_URL        — Railway Postgres connection string
#   VOYAGE_API_KEY      — Voyage AI API key (embeddings)
#   ZAI_API_KEY         — optional; z.ai GLM-5 for analysis (falls back to the
#                         Railway LLM gateway if unset)

name: Bookmark enrichment (crawl → analyze → embed)

on:
  schedule:
    # 04:17 UTC daily — off the top of the hour to dodge GitHub's cron rush.
    - cron: '17 4 * * *'
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read

# Never run two embed jobs at once — concurrent Voyage calls + DB writes on the
# same table would race on the unique bookmark_id upserts.
concurrency:
  group: embed-bookmarks
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      EMBEDDING_MODEL: voyage-4-large
      EMBEDDING_DIMENSIONS: '1024'
      DB_SCHEMA: te9_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sanity check secrets present
        run: |
          test -n "$DATABASE_URL"  || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "$VOYAGE_API_KEY" || { echo "::error::VOYAGE_API_KEY secret is not set"; exit 1; }

      - name: Crawl new bookmarks (→ bookmark_content)
        run: npm run crawl

      - name: Analyze new bookmarks (→ bookmark_analysis, LLM)
        run: npm run analyze
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}

      - name: Classify archetypes (→ bookmark_archetypes)
        run: npx tsx scripts/backfill-archetypes.ts --missing

      - name: Embed new bookmarks
        run: npm run embed

      - name: Summary
        if: always()
        run: |
          echo "### Enrichment run: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Crawl + analyze are capped at ~100 rows/run; embed catches up everything missing." >> "$GITHUB_STEP_SUMMARY"
