# The Drum — run the feed draw daily at 06:00 Amsterdam time. The draw is
# cadence-gated (1 item / day by default, admin-configurable in
# te9_dev.feed_settings.cadence_hours), so the daily check draws exactly once.
# Idempotent: draws only when due. New cards are DRAFTS — the draw emails the
# operator (approval-by-email) and nothing publishes until approved.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   DATABASE_URL       — Railway Postgres connection string
#   UTOBO_EMAIL_API_KEY — for the approval-request email (optional: without it
#                         the card still drafts; approve via /admin/feed)
#
# Timezone note: GitHub cron is UTC-only. 05:03 UTC = 06:03 Amsterdam in
# winter (CET, UTC+1); during DST (CEST, UTC+2) it fires at 07:03 local.

name: The Drum (feed draw)

on:
  schedule:
    # Morning window 04:03–06:03 UTC (cadence-gated: only the first attempt
    # past the 24h clock draws — normally 05:03 UTC = 06:03 Amsterdam CET;
    # DST summer it is 07:03 local, GitHub cron is UTC-only). The evening
    # attempt is a catch-up: it only fires if the morning attempts all missed,
    # so the drum never loses a day. Redundant attempts no-op when not due.
    - cron: '3 4,5,6 * * *'
    - cron: '3 16 * * *'
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: feed-draw
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_SCHEMA: te9_dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sanity check secrets present
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
      - name: Run the drum
        env:
          UTOBO_EMAIL_API_KEY: ${{ secrets.UTOBO_EMAIL_API_KEY }}
          DRUM_APPROVAL_EMAIL: ${{ secrets.DRUM_APPROVAL_EMAIL }}
          DRUM_APPROVAL_SECRET: ${{ secrets.DRUM_APPROVAL_SECRET }}
        run: npx tsx scripts/feed-draw.ts

      - name: Summary
        if: always()
        run: |
          echo "### Drum draw: ${{ job.status }} — cadence-gated, draws only when due" >> "$GITHUB_STEP_SUMMARY"
