<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F9FBFA" />
		<script>
			// pre-paint theme: stored preference wins, else OS preference — runs before first paint
			(() => {
				let t = null;
				try {
					t = localStorage.getItem('theme');
				} catch {
					/* storage unavailable */
				}
				const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', dark ? '#1A2221' : '#F9FBFA');
			})();
		</script>
		<title>productsear.ch</title>
		<!-- Privacy-friendly analytics by Plausible -->
		<script async src="https://plausible.io/js/pa-wy3y_Tr88wMGSxJ0WPXrO.js"></script>
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(plausible.q = plausible.q || []).push(arguments);
				},
				(plausible.init =
					plausible.init ||
					function (i) {
						plausible.o = i || {};
					});
			plausible.init();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
